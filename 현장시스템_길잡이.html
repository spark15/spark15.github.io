<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>현장 시스템 길잡이 (초안)</title>
<style>
:root{
  --bg:#f3f5f8;--card:#fff;--ink:#111827;--muted:#4b5563;--line:#d9dee5;
  --brand:#1d4e89;--brand-soft:#e8eff8;
  --ok:#1b7a43;--ok-soft:#e4f4ea;--warn:#9a5a00;--warn-soft:#fdf1df;
  --no:#8a3b3b;--no-soft:#f8e8e8;--lock:#5b3c88;--lock-soft:#f1ecf9;
}
*{box-sizing:border-box}
body{margin:0;font-family:"Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",sans-serif;background:var(--bg);color:var(--ink);line-height:1.65;font-size:16px;-webkit-font-smoothing:antialiased}
header.top{background:var(--brand);color:#fff;padding:0 24px;display:flex;align-items:center;gap:20px;position:sticky;top:0;z-index:10;flex-wrap:wrap}
header.top .logo{font-weight:700;font-size:17px;padding:13px 0;cursor:pointer}
header.top .logo small{font-weight:400;opacity:.75;margin-left:6px;font-size:12px}
nav{display:flex;flex-wrap:wrap}
nav a{color:#d6e2f1;text-decoration:none;padding:15px 10px 12px;font-size:14px;border-bottom:3px solid transparent}
nav a.active,nav a:hover{color:#fff;border-bottom-color:#fff}
main{max-width:1120px;margin:0 auto;padding:24px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:20px 22px;margin-bottom:16px}
h1{font-size:24px;margin:0 0 6px}
h2{font-size:19px;margin:0 0 12px}
h3{font-size:16px;margin:18px 0 8px}
.muted{color:var(--muted)}
.small{font-size:13.5px}
table{width:100%;border-collapse:collapse;font-size:14px;margin:8px 0}
th,td{border:1px solid var(--line);padding:7px 9px;text-align:left;vertical-align:top}
th{background:#f0f3f7;font-weight:600;white-space:nowrap}
.badge{display:inline-block;font-size:12px;padding:2px 9px;border-radius:999px;font-weight:600;vertical-align:middle;white-space:nowrap}
.b-ok{background:var(--ok-soft);color:var(--ok)}
.b-warn{background:var(--warn-soft);color:var(--warn)}
.b-no{background:var(--no-soft);color:var(--no)}
.b-lock{background:var(--lock-soft);color:var(--lock)}
.b-brand{background:var(--brand-soft);color:var(--brand)}
.b-gray{background:#eef0f3;color:#4b5563}
.src{display:inline-block;font-size:11.5px;color:#6b7280;border:1px solid #e3e7ec;border-radius:4px;padding:0 6px;margin-left:6px;font-weight:400;vertical-align:middle;line-height:1.6;white-space:nowrap}
.locked{border-left:4px solid var(--lock);background:var(--lock-soft);padding:12px 16px;border-radius:6px;margin:10px 0}
.locked .lock-h{font-size:12px;color:var(--lock);font-weight:700;margin-bottom:4px}
.locked ul{margin:6px 0 0;padding-left:20px}
.ai-note{font-size:12.5px;color:var(--warn);background:var(--warn-soft);border-radius:6px;padding:6px 10px;display:inline-block}
.btn{display:inline-block;font:inherit;font-size:14px;border:1px solid var(--brand);background:var(--brand);color:#fff;border-radius:6px;padding:7px 14px;cursor:pointer;text-decoration:none;line-height:1.4}
.btn:hover{filter:brightness(1.1)}
.btn.ghost{background:#fff;color:var(--brand)}
.btn.ghost:hover{background:var(--brand-soft)}
.btn.sm{font-size:12.5px;padding:3px 9px;white-space:nowrap}
.btn.danger{background:#fff;color:var(--no);border-color:#d9b3b3}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
textarea,input[type=text],input[type=date],select{font:inherit;font-size:14px;border:1px solid var(--line);border-radius:6px;padding:7px 10px;width:100%;background:#fff}
textarea{resize:vertical}
label.fld{display:block;font-size:13px;font-weight:600;margin:12px 0 4px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{font:inherit;font-size:13px;border:1px solid var(--line);background:#fff;border-radius:999px;padding:4px 12px;cursor:pointer;color:var(--ink)}
.chip:hover{border-color:var(--brand);color:var(--brand)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.syscard{background:#fff;border:1px solid var(--line);border-radius:10px;padding:16px 18px;display:flex;flex-direction:column;gap:6px}
.syscard .t{font-weight:700;font-size:16px}
.result{border:1px solid var(--line);border-radius:10px;padding:16px 18px;margin:12px 0;background:#fff}
.result.r-ok{border-left:5px solid var(--ok)}
.result.r-warn{border-left:5px solid var(--warn)}
.result.r-no{border-left:5px solid var(--no)}
.hit{margin:6px 0;padding:8px 10px;background:#f7f9fb;border-radius:6px;font-size:14px}
.hit mark{background:#fff3b0;padding:0 2px;border-radius:2px}
ul.check{list-style:none;padding-left:0;margin:4px 0}
ul.check li{padding-left:22px;position:relative;margin:3px 0}
ul.check li:before{content:"";position:absolute;left:2px;top:6px;width:11px;height:11px;border:1.5px solid #9aa5b1;border-radius:3px}
.roles{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px}
.role{border:1px solid var(--line);border-radius:8px;padding:10px 14px;background:#fbfcfd}
.role h4{margin:0 0 4px;font-size:14.5px}
details.faq{border:1px solid var(--line);border-radius:8px;padding:8px 12px;margin:6px 0;background:#fff}
details.faq summary{cursor:pointer;font-weight:600}
pre.flow{background:#f7f9fb;border:1px solid var(--line);border-radius:6px;padding:12px;overflow:auto;font-size:13px;font-family:Consolas,"D2Coding",monospace}
.timeline{list-style:none;padding:0;margin:8px 0;border-left:3px solid var(--brand-soft)}
.timeline li{padding:4px 0 4px 16px;position:relative}
.timeline li:before{content:"";position:absolute;left:-7px;top:11px;width:11px;height:11px;border-radius:50%;background:var(--brand)}
.timeline b{display:inline-block;min-width:60px;color:var(--brand)}
.toc{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.toc a{font-size:13px;color:var(--brand);background:var(--brand-soft);padding:3px 10px;border-radius:999px;text-decoration:none;cursor:pointer}
.hero{background:linear-gradient(135deg,#1d4e89,#2f6db3);color:#fff;border:none}
.hero h1{color:#fff}
.hero .muted{color:#d6e2f1}
.hero textarea{border:none;font-size:15px;margin-top:12px}
.hero .chip{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.3);color:#fff}
.hero .chip:hover{background:rgba(255,255,255,.25)}
.hero .btn{background:#fff;color:var(--brand);border-color:#fff;font-weight:700}
.rnr-table td{padding:4px 6px}
.rnr-table input[type=text]{padding:4px 6px;font-size:13px}
.rnr-table tr.grp td{background:var(--brand-soft);font-weight:700}
.rnr-table tr.deleted td{color:#9aa5b1;text-decoration:line-through}
.rnr-table tr.deleted td.keep{text-decoration:none}
.rnr-table .reason{color:var(--no);font-size:12px;text-decoration:none;display:block}
.rnr-table td.c{text-align:center}
.sysselect{display:flex;flex-wrap:wrap;gap:8px 18px;margin-top:6px}
.sysselect label{font-size:14px;cursor:pointer}
.sign{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:10px}
.sign .box{border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.sign .box .stamp{height:56px;border:1px dashed #c3cad3;border-radius:6px;margin-top:8px;display:flex;align-items:center;justify-content:center;color:#b0b8c2;font-size:12px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.doc{border:1px solid #c9d1db;padding:28px 32px;background:#fff}
.doc h1{text-align:center;font-size:22px;margin-bottom:18px}
.doc th{width:22%;white-space:normal}
.toast{position:fixed;bottom:20px;right:20px;background:#1f2933;color:#fff;padding:9px 16px;border-radius:8px;font-size:14px;opacity:0;transition:opacity .25s;pointer-events:none}
.toast.on{opacity:.95}
/* 시스템 소개 — 카드 기반 */
.sysec{margin:26px 0 8px}
.sec-h{display:flex;align-items:center;flex-wrap:wrap;gap:4px;margin:0 0 12px;scroll-margin-top:72px}
.sec-h h2{margin:0;font-size:19px;padding-left:10px;border-left:4px solid var(--brand);line-height:1.2}
.sysec h3{font-size:15px;margin:20px 0 10px}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.cgrid.wide{grid-template-columns:repeat(auto-fill,minmax(330px,1fr))}
.cgrid.g4{grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
.c{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px;box-shadow:0 1px 2px rgba(16,24,40,.04);display:flex;flex-direction:column;gap:6px;transition:border-color .15s,box-shadow .15s;color:inherit;text-decoration:none}
.c:hover{border-color:#b7c6d9;box-shadow:0 4px 14px rgba(16,24,40,.07)}
.c-t{font-weight:700;font-size:15px;line-height:1.4;display:flex;align-items:center;flex-wrap:wrap;gap:6px}
.c-d{font-size:13.5px;color:#3b4652}
.c-f{margin-top:auto;padding-top:4px}
.c.accent{border-top:4px solid var(--brand)}
.c.mini{padding:11px 14px}
.c.feat{border-left:4px solid var(--brand-soft)}
.c.feat:hover{border-left-color:var(--brand)}
.c.note{background:var(--warn-soft);border-color:#f0d8b0;margin-top:12px}
.c.stat{background:#f8fafc;box-shadow:none}
.stat-l{font-size:12px;color:var(--muted);font-weight:600}
.stat-v{font-size:15px;font-weight:700}
.c.link .go{margin-left:auto;color:var(--brand);font-size:18px}
.c.locked-c{border-color:#d5c8ec;background:#fcfaff}
.locked .c{box-shadow:none}
.num{display:inline-flex;min-width:26px;height:26px;padding:0 6px;border-radius:13px;background:var(--brand);color:#fff;font-size:13px;font-weight:700;align-items:center;justify-content:center}
.when{display:inline-block;font-size:12.5px;font-weight:700;color:var(--brand);background:var(--brand-soft);border-radius:6px;padding:2px 9px}
.q{display:inline-flex;font-size:12px;font-weight:700;color:#fff;background:var(--lock);border-radius:6px;padding:1px 7px}
.chip-s{display:inline-block;font-size:12px;background:#eef1f5;color:#3b4652;border-radius:5px;padding:2px 8px;margin:2px 4px 2px 0}
.chain{display:flex;flex-wrap:wrap;align-items:center;gap:4px;margin-top:4px}
.chain span{font-size:12.5px;font-weight:600;background:var(--lock-soft);color:var(--lock);border-radius:5px;padding:2px 8px}
.chain i{font-style:normal;color:#9aa5b1}
/* ── 시스템 소개 v2: 한눈에 보기 + 고정 목차 + 내 역할 보기 ── */
.sys-page{--sc:#1d4e89;--sbg:#e8eff8}
.btn.sc{background:var(--sc);border-color:var(--sc)}
.sys-hero{background:#fff;border:1px solid var(--line);border-top:6px solid var(--sc);border-radius:14px;padding:20px 24px 18px;margin-bottom:14px}
.crumb{font-size:13px;color:var(--muted)}
.crumb a{color:var(--muted)}
.sys-title{display:flex;gap:16px;align-items:flex-start;margin:10px 0 16px}
.sys-ico{flex:none;width:58px;height:58px;border-radius:14px;background:var(--sbg);color:var(--sc);display:flex;align-items:center;justify-content:center}
.sys-kicker{font-size:13px;font-weight:700;color:var(--sc);letter-spacing:.02em}
.sys-title h1{font-size:28px;margin:0;line-height:1.3}
.sys-one{font-size:16.5px;color:#374151;margin-top:2px}
.sys-users{font-size:14px;color:var(--muted);margin-top:4px}
.bento{display:grid;grid-template-columns:2fr 1.3fr 1fr;grid-template-rows:auto auto;gap:12px}
.tile{background:#f8fafc;border:1px solid #e6eaf0;border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.tile .src{margin:auto 0 0;align-self:flex-start}
.tile-l{font-size:12.5px;font-weight:700;color:var(--muted)}
.tile-v{font-size:19px;font-weight:700;color:var(--ink);line-height:1.35}
.tile-v.big{font-size:16px;font-weight:500;line-height:1.7}
.tile-s{font-size:13.5px;color:#374151}
.t-purpose{grid-row:span 2;background:var(--sbg);border-color:transparent}
.t-feat{grid-row:span 2}
.mini-list{margin:4px 0 6px;padding-left:18px;font-size:15px;font-weight:600}
.mini-list li{margin:3px 0}
.more{font-size:13.5px;color:var(--sc);font-weight:600;text-decoration:none;margin-top:auto}
.role-bar{display:flex;flex-wrap:wrap;align-items:center;gap:6px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-bottom:16px}
.rb-l{font-size:13.5px;font-weight:700;margin-right:4px}
.rb-hint{font-size:12.5px;color:var(--muted);margin-left:4px}
.rchip{font:inherit;font-size:13.5px;border:1px solid var(--line);background:#fff;color:#374151;border-radius:999px;padding:4px 12px;cursor:pointer}
.rchip:hover{border-color:var(--sc);color:var(--sc)}
.rchip.on{background:var(--sc);border-color:var(--sc);color:#fff;font-weight:600}
.rchip.sm{font-size:12.5px;padding:2px 10px}
.sys-body{display:grid;grid-template-columns:190px minmax(0,1fr);gap:22px;align-items:start}
.side-toc{position:sticky;top:calc(var(--hd,56px) + 14px);display:flex;flex-direction:column;border-left:2px solid var(--line)}
.st-h{font-size:12px;font-weight:700;color:var(--muted);padding:0 0 6px 12px}
.side-toc a{font-size:14px;color:#4b5563;text-decoration:none;padding:5px 0 5px 12px;margin-left:-2px;border-left:2px solid transparent}
.side-toc a:hover{color:var(--ink)}
.side-toc a.on{color:var(--sc);border-left-color:var(--sc);font-weight:700}
.sys-main .sysec:first-child{margin-top:0}
.sys-page .sec-h h2{border-left-color:var(--sc)}
.feat-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
.feat{background:#fff;border:1px solid var(--line);border-left:4px solid var(--sc);border-radius:10px;padding:12px 14px}
.feat-t{font-weight:700;font-size:15.5px;margin-bottom:2px}
.c.lv2{background:#fafbfc;box-shadow:none}
.my-role{background:var(--sbg);border:2px solid var(--sc);border-radius:14px;padding:16px 20px}
.mr-h{font-size:17px;font-weight:700;margin-bottom:6px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.my-role .badge{background:var(--sc);color:#fff}
ul.check.big li{font-size:16px;margin:7px 0;padding-left:26px}
ul.check.big li:before{width:14px;height:14px;top:5px;border-color:var(--sc)}
.other-roles{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:10px}
.print-only{display:none}
.stages{list-style:none;padding:0;margin:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.stages li{display:flex;gap:10px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:11px 13px}
.stages .num{background:var(--sc);flex:none}
.stg-t{font-weight:700}
.appr{display:flex;flex-direction:column;gap:8px}
.appr-r{display:grid;grid-template-columns:64px 1fr;gap:12px;background:#fff;border:1px solid #e3dcf1;border-radius:10px;padding:10px 14px}
.appr-k{font-weight:700;color:var(--lock)}
.tl{list-style:none;padding:0;margin:0;position:relative}
.tl li{display:grid;grid-template-columns:150px 22px 1fr;gap:0 10px;position:relative;padding-bottom:14px}
.tl li:before{content:"";position:absolute;left:160px;top:16px;bottom:-4px;width:2px;background:var(--line)}
.tl li:last-child:before{display:none}
.tl-when{font-size:13.5px;font-weight:700;color:var(--sc);text-align:right;padding-top:2px}
.tl-dot{width:14px;height:14px;border-radius:50%;background:#fff;border:3px solid var(--sc);margin:4px 0 0 4px;position:relative;z-index:1}
.tl-task{font-weight:600;font-size:15.5px;margin-bottom:3px}
.tl li.hit .tl-body{background:var(--sbg);border-radius:8px;padding:6px 10px;margin:-6px 0 0 -10px}
.tl li.hit .tl-dot{background:var(--sc)}
.tl li.dim,.flow-list li.dim{opacity:.45}
.chip-s.on{background:var(--sc);color:#fff;font-weight:600}
.mine-b{background:var(--sc);color:#fff;margin-left:8px}
.note-box{background:var(--warn-soft);border:1px solid #f0d8b0;border-radius:10px;padding:10px 14px;font-size:14.5px;margin-top:4px}
.rowlist{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;background:#fff;overflow:hidden}
.rl{display:flex;align-items:center;gap:12px;padding:10px 14px;border-top:1px solid #eef1f4;flex-wrap:wrap}
.rl:first-child{border-top:none}
.rl-m{font-weight:600}
.rl-s{margin-left:auto;font-size:13.5px;color:var(--muted)}
.flow-list{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:8px}
.flow-list li{display:flex;gap:12px;align-items:flex-start;background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 14px;font-size:15px}
.flow-list .num{background:var(--sc);flex:none}
.flow-list li.hit{border-color:var(--sc);background:var(--sbg)}
.faq-search{margin-bottom:10px}
details.faq{border-radius:10px;padding:10px 14px;margin:0 0 8px}
details.faq summary{display:flex;gap:8px;align-items:center;font-size:15.5px;list-style:none}
details.faq summary::-webkit-details-marker{display:none}
details.faq summary:after{content:"＋";margin-left:auto;color:var(--muted)}
details.faq[open] summary:after{content:"－"}
details.faq p{margin:8px 0 2px 34px;color:#374151}
details.faq.lockf{border-color:#d5c8ec;background:#fcfaff}
.sys-page .q{background:var(--sc);flex:none}
.mini-ico{display:inline-flex;width:28px;height:28px;border-radius:8px;background:var(--sbg);color:var(--sc);align-items:center;justify-content:center}
.c.link .c-t{flex-wrap:nowrap}
/* 시스템 카드·추천 카드 아이콘 */
.syscard{border-top:4px solid var(--sc,#1d4e89)}
.syscard .t{display:flex;align-items:center;gap:10px}
.result .r-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.lead{font-size:17px;font-weight:600;margin:12px 0 4px}
.lead b{color:var(--brand)}
@media (max-width:900px){
  .sys-body{grid-template-columns:1fr}
  .side-toc{position:static;flex-direction:row;flex-wrap:wrap;border-left:none;gap:6px}
  .side-toc .st-h{display:none}
  .side-toc a{border:1px solid var(--line);border-radius:999px;padding:3px 10px;margin:0;background:#fff;font-size:13px}
  .side-toc a.on{border-color:var(--sc)}
  .bento{grid-template-columns:1fr}
  .t-purpose,.t-feat{grid-row:auto}
  .tl li{grid-template-columns:22px 1fr}
  .tl li:before{left:10px}
  .tl-when{grid-column:2;text-align:left}
  .tl-dot{grid-row:1 / span 2;grid-column:1}
  .tl-body{grid-column:2}
  header.top{flex-wrap:nowrap;padding:0 12px;gap:10px}
  header.top .logo{font-size:15px;white-space:nowrap}
  header.top .logo small{display:none}
  nav{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
  nav a{white-space:nowrap;padding:14px 8px 11px;font-size:13.5px}
}
/* 화면 내 대화상자 (prompt/confirm/alert 대체) */
.modal-bg{position:fixed;inset:0;background:rgba(15,23,42,.45);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal{background:#fff;border-radius:12px;max-width:560px;width:100%;padding:20px 22px;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.modal h3{margin:0 0 8px;font-size:17px}
.modal .err{color:var(--no);font-size:13px;min-height:18px;margin-top:4px}
footer{max-width:1120px;margin:0 auto;padding:0 24px 30px;font-size:12px;color:var(--muted)}
@media (max-width:720px){.two,.three,.sign{grid-template-columns:1fr}main{padding:14px}}
@media print{
  header.top,.noprint,footer,.toast{display:none!important}
  body{background:#fff;font-size:12.5px}
  main{padding:0;max-width:none}
  .card{border:none;padding:0;margin-bottom:10px}
  input[type=text],input[type=date],textarea,select{border:none;padding:0;background:transparent}
  .rnr-table input[type=text]{font-size:12px}
  .doc{border:none;padding:0}
  tr,.role,.box,.c{page-break-inside:avoid;break-inside:avoid}
  .c{box-shadow:none}
  .sysec{margin:14px 0 4px}
  .sys-body{display:block}

const $app = document.getElementById("app");
const byId = id => SYSTEMS.find(s => s.id === id);
function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
function src(file, sec) { return '<span class="src">출처: ' + esc(file) + (sec ? " " + esc(sec) : "") + "</span>"; }
function tbl(headers, rows) {
  return "<table><thead><tr>" + headers.map(h => "<th>" + esc(h) + "</th>").join("") + "</tr></thead><tbody>" +
    rows.map(r => "<tr>" + r.map(c => "<td>" + esc(c) + "</td>").join("") + "</tr>").join("") + "</tbody></table>";
}
function lockedBox(title, inner, srcHtml) {
  return '<div class="locked"><div class="lock-h">원문 고정 · 정산/책임 근거 규칙 — 요약·재해석 없이 기준 문서 원문 그대로 표시</div><strong>' +
    esc(title) + "</strong>" + srcHtml + inner + "</div>";
}
function catBadge(c) { return '<span class="badge ' + (c === "필수" ? "b-ok" : "b-warn") + '">' + esc(c) + "</span>"; }
function toast(msg) { const t = document.getElementById("toast"); t.textContent = msg; t.classList.add("on"); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove("on"), 1800); }
function store(key, val) { try { if (val === undefined) { const v = localStorage.getItem(key); return v ? JSON.parse(v) : null; } localStorage.setItem(key, JSON.stringify(val)); } catch (e) { return null; } }
function download(name, text) {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([text], { type: "application/json" }));
  a.download = name; document.body.appendChild(a); a.click(); a.remove();
}
function related(id) { return OVERVIEW.relations.filter(r => r.a === id || r.b === id); }
// 부드러운 스크롤은 일부 내장 브라우저에서 동작하지 않아 즉시 이동 (상단 고정 메뉴 높이만큼 보정)
function scrollToId(id) {

/* 화면 내 대화상자 — 브라우저 기본 prompt/confirm/alert는 앱 내장 브라우저 등에서 동작하지 않으므로 사용하지 않음
   onOk가 문자열을 돌려주면 오류 메시지로 표시하고 창을 닫지 않음 */
function openModal(o) {
  closeModal();
  const bg = document.createElement("div");
  bg.className = "modal-bg noprint"; bg.id = "modalBg";
  bg.innerHTML = '<div class="modal" role="dialog" aria-modal="true"><h3>' + esc(o.title) + "</h3>" + (o.body || "") +
    '<div class="err" id="mErr"></div><div class="btn-row" style="justify-content:flex-end">' +
    (o.cancelText ? '<button class="btn ghost" id="mCancel">' + esc(o.cancelText) + "</button>" : "") +
    '<button class="btn' + (o.danger ? " danger" : "") + '" id="mOk">' + esc(o.okText || "확인") + "</button></div></div>";
  document.body.appendChild(bg);
  const ok = () => {
    const r = o.onOk ? o.onOk() : true;
    if (typeof r === "string") { document.getElementById("mErr").textContent = r; return; }
    closeModal();
  };
  document.getElementById("mOk").onclick = ok;
  if (o.cancelText) document.getElementById("mCancel").onclick = closeModal;
  bg.addEventListener("click", e => { if (e.target === bg) closeModal(); });
  bg.addEventListener("keydown", e => { if (e.key === "Escape") closeModal(); });
  if (o.onOpen) o.onOpen();
  const f = bg.querySelector("textarea:not([readonly]),input[type=text]") || document.getElementById("mOk");
  f.focus();
}
function closeModal() { const m = document.getElementById("modalBg"); if (m) m.remove(); }
function askConfirm(title, msg, okText, onOk) {
  openModal({ title: title, body: "<p>" + esc(msg) + "</p>", okText: okText, cancelText: "취소", danger: true, onOk: () => { onOk(); return true; } });
}
function askText(title, msg, ph, okText, onOk) {
  openModal({ title: title, body: '<p class="small">' + esc(msg) + '</p><textarea id="mInput" rows="3" placeholder="' + esc(ph) + '"></textarea>',
    okText: okText, cancelText: "취소", danger: true,
    onOk: () => { const v = document.getElementById("mInput").value.trim(); if (!v) return "사유를 입력해야 삭제할 수 있어요."; onOk(v); return true; } });
}
function copyText(ta) {
  ta.select();
  const done = () => toast("복사했어요");
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(ta.value).then(done, () => { try { document.execCommand("copy"); done(); } catch (e) { toast("Ctrl+C로 복사하세요"); } });
  else { try { document.execCommand("copy"); done(); } catch (e) { toast("Ctrl+C로 복사하세요"); } }
}

/* =====================================================================
   2단계 대조 — AI 판단 대체 로직 (키워드·동의어 매칭, 결정적)
   - 입력과 용어를 정규화(소문자·공백 제거) 후 포함 여부로 점수 계산
   - 점수 2 이상: 추천 / 1: 부분 대응 / 0: 해당 없음
   - 난수·시간을 쓰지 않으므로 같은 입력 → 같은 결과
   ===================================================================== */
function norm(s) { return String(s || "").toLowerCase().replace(/\s+/g, ""); }
function featureDesc(sys, concept) {
  if (concept.ref) return { desc: concept.ref, sec: concept.refSec || sys.featuresSec };
  const f = sys.features.find(x => x[0] === concept.feature);
  return { desc: f ? f[1] : sys.purpose, sec: sys.featuresSec };
}
function matchSystems(query) {
  const nq = norm(query);
  if (!nq) return [];
  const out = [];
  SYSTEMS.forEach(sys => {
    const hits = []; const seen = new Set();
    sys.concepts.forEach(c => {
      const terms = [];
      c.terms.forEach(t => { const nt = norm(t); if (nt && nq.includes(nt) && !seen.has(nt)) { seen.add(nt); terms.push(t); } });
      if (terms.length) hits.push(Object.assign({ feature: c.feature, terms: terms }, featureDesc(sys, c)));
    });
    const score = hits.reduce((n, h) => n + h.terms.length, 0);
    if (score > 0) out.push({ sys: sys, hits: hits, score: score, verdict: score >= 2 ? "추천" : "부분 대응" });
  });
  out.sort((a, b) => b.score - a.score || a.sys.no - b.sys.no);
  return out;
}
function matchRules(query) {
  const nq = norm(query);
  return RULE_LOOKUPS.filter(r => r.terms.some(t => nq.includes(norm(t))));
}
function renderRuleLookup(r) {
  if (r.kind === "mandatory") {
    return lockedBox("필수 vs 선택 적용 기준", tbl(["시스템", "구분", "판단 기준"], OVERVIEW.mandatory), src(F0, "§5"));
  }
  const s = byId(r.sys);
  if (r.kind === "rules") return lockedBox(s.name + " — " + s.rules.title, "<ul>" + s.rules.items.map(i => "<li>" + esc(i) + "</li>").join("") + "</ul>", src(s.file, s.rules.sec));
  if (r.kind === "faq") { const f = s.faq[r.faqIdx]; return lockedBox(s.name + " — FAQ: " + f[0], "<p style='margin:6px 0 0'>" + esc(f[1]) + "</p>", src(s.file, "§6 Q" + (r.faqIdx + 1))); }
  if (r.kind === "extra") { const x = s.extras[r.extraIdx]; return lockedBox(s.name + " — " + x.title, tbl(x.headers, x.rows), src(s.file, x.sec)); }
  if (r.kind === "items") return lockedBox(s.name + " — " + r.title, "<ul>" + r.items.map(i => "<li><span class='muted small'>[" + esc(i[0]) + "]</span> " + esc(i[1]) + "</li>").join("") + "</ul>", src(s.file, ""));
  return "";
}

          '<div class="small muted">일치한 표현: ' + x.terms.map(t => "<mark>" + esc(t) + "</mark>").join(", ") + "</div></div>").join("") +
        (ok ? "" : '<p class="small" style="color:var(--warn);margin:6px 0 0">일부 표현만 대응돼요. 이 시스템으로 안 되는 기능은 구축(개선) 요청 대상으로 정리할 수 있어요.</p>') +
        (related(r.sys.id).length ? '<div class="small" style="margin-top:6px"><strong>함께 쓰면 좋은 시스템</strong>' + src(F0, "§2") + "<ul style='margin:4px 0;padding-left:18px'>" + related(r.sys.id).map(x => "<li>" + esc(x.text) + "</li>").join("") + "</ul></div>" : "") +
        '<div class="btn-row"><a class="btn" href="#/sys/' + r.sys.id + '">소개 페이지 보기</a>' +
        '<a class="btn ghost" href="#/sys/' + r.sys.id + '/setup">셋업 준비사항 보기</a>' +
        '<a class="btn ghost" href="#/rnr/' + r.sys.id + '">우리 현장 R&amp;R 작성</a>' +
        (ok ? "" : '<button class="btn ghost" data-req="1">구축(개선) 요청</button>') + "</div></div>";
    });
    h += '<p class="small muted">원하는 기능이 아닌가요? <a href="javascript:void(0)" data-req="1">시스템 구축 요청 계획서 작성하기</a></p>';
  }
  h += "</section>";
  box.innerHTML = h;
  // 검색한 문장을 요청 업무로 넘김 (이전 초안은 새 요청 기준으로 다시 만들도록 초기화)
  box.querySelectorAll("[data-req]").forEach(b => b.onclick = () => { req.need = lastQuery; req.drafted = false; saveReq(); location.hash = "#/request"; });
}

};
const LOCK_ICON = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>';
function sysIcon(id, size) {
  const st = SYS_STYLE[id]; size = size || 24;
  return '<svg class="ico" width="' + size + '" height="' + size + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + st.icon + "</svg>";
}
function sysVars(id) { const st = SYS_STYLE[id]; return "--sc:" + st.c + ";--sbg:" + st.bg; }
function headerH() { const hd = document.querySelector("header.top"); return hd ? hd.offsetHeight : 0; }

/* '내 역할 보기' — 역할명과 셋업 절차·운영 흐름의 담당 표기를 대조해 강조 (표시 보조용, 판정·정산과 무관) */
function roleKeys(role) {
  const k = []; const add = (re, arr) => { if (re.test(role)) k.push.apply(k, arr); };
  add(/시스템운영팀/, ["운영팀"]);
  add(/현장 시스템 담당/, ["현장 시스템 담당", "현장 담당자"]);
  add(/IT/, ["IT"]);
  add(/현장소장/, ["소장"]);
  add(/안전/, ["안전"]);
  add(/협력업체/, ["협력업체", "업체"]);
  add(/공종 담당/, ["공종 담당"]);
  add(/철골 담당/, ["철골 담당", "현장 +"]);
  add(/현장 자재 담당/, ["자재 담당", "자재 +"]);
  add(/제작사/, ["제작사"]);
  add(/감리/, ["감리", "외부"]);
  add(/경비/, ["경비"]);
  add(/운송사/, ["운송사"]);
  add(/시공\(건립\)/, ["시공"]);
  add(/품질/, ["품질"]);
  return k;
}
function roleHit(text, role) { if (!role) return false; if (/전원/.test(text)) return true; return roleKeys(role).some(k => text.indexOf(k) >= 0); }
const sysRoleSel = {};

function pageSystem(id, anchor) {
  const s = byId(id);
  if (!s) { location.hash = "#/systems"; return; }
  const rel = related(s.id);
  const mand = OVERVIEW.mandatory.find(m => m[0] === s.name);
  const role = sysRoleSel[s.id] || "";
  const chip = (t, cls) => '<span class="chip-s' + (cls ? " " + cls : "") + '">' + esc(t) + "</span>";
  const head = (id2, title, srcHtml, extra) => '<div class="sec-h" id="' + id2 + '"><h2>' + esc(title) + "</h2>" + (extra || "") + srcHtml + "</div>";
  const toc = [];
  if (s.rules) toc.push(["sec-rules", "꼭 지킬 규칙"]);
  toc.push(["sec-intro", "시스템 소개"], ["sec-features", "주요 기능"], ["sec-roles", "누가 무엇을 준비하나"], ["sec-setup", "셋업 절차"], ["sec-forms", "필요 서식"], ["sec-flow", "운영 흐름"], ["sec-faq", "FAQ"], ["sec-contact", "문의처"]);

  /* ── 머리 + 한눈에 보기 ── */
  let h = '<div class="sys-page" style="' + sysVars(s.id) + '">' +
    '<section class="sys-hero">' +
      '<div class="crumb"><a href="#/systems">시스템 목록</a> › ' + esc(s.name) + "</div>" +
      '<div class="sys-title"><span class="sys-ico">' + sysIcon(s.id, 30) + "</span><div>" +
        '<div class="sys-kicker">시스템 ' + s.no + " · " + esc(s.category) + "</div>" +
        "<h1>" + esc(s.name) + "</h1>" +
        '<div class="sys-one">' + esc(s.oneLine) + "</div>" +
        '<div class="sys-users">주 사용자 · ' + esc(s.overview.users) + "</div>" +
      "</div></div>" +
      '<div class="bento">' +
        '<div class="tile t-purpose"><div class="tile-l">목적</div><div class="tile-v big">' + esc(s.purpose) + "</div>" + src(s.file, "§1.1") + "</div>" +
        '<div class="tile t-feat"><div class="tile-l">주요 기능</div><ul class="mini-list">' + s.features.slice(0, 3).map(f => "<li>" + esc(f[0]) + "</li>").join("") + "</ul>" +
          '<a class="more" href="javascript:void(0)" onclick="scrollToId(\'sec-features\')">전체 ' + s.features.length + "개 보기 ›</a></div>" +
        '<div class="tile"><div class="tile-l">표준 셋업 기간</div><div class="tile-v">' + esc(s.overview.period) + '</div><div class="tile-s">적용 난이도 ' + esc(s.overview.difficulty) + "</div>" + src(F0, "§1") + "</div>" +
        '<div class="tile"><div class="tile-l">적용 기준</div><div class="tile-v">' + esc(mand ? mand[1] : "미확인") + '</div><div class="tile-s">' + esc(mand ? mand[2] : "") + "</div>" + src(F0, "§5") + "</div>" +
      "</div>" +
      '<div class="btn-row noprint"><a class="btn sc" href="#/rnr/' + s.id + '">이 시스템으로 우리 현장 R&amp;R 작성</a><a class="btn ghost" href="#/roadmap">통합 셋업 로드맵</a><button class="btn ghost" data-print="1">인쇄</button></div>' +
    "</section>" +

    /* ── 내 역할 보기 ── */
    '<section class="role-bar noprint"><span class="rb-l">내 역할 보기</span>' +
      '<button class="rchip' + (role ? "" : " on") + '" data-role="">전체</button>' +
      s.roles.map(r => '<button class="rchip' + (role === r.role ? " on" : "") + '" data-role="' + esc(r.role) + '">' + esc(r.role) + "</button>").join("") +
      (role ? '<span class="rb-hint">선택한 역할의 준비사항과 담당 단계를 강조해요</span>' : "") +
    "</section>" +

    '<div class="sys-body"><nav class="side-toc noprint"><div class="st-h">목차</div>' +
      toc.map(t => '<a href="javascript:void(0)" data-sec="' + t[0] + '" onclick="scrollToId(\'' + t[0] + '\')">' + esc(t[1]) + "</a>").join("") +
    '</nav><div class="sys-main">';

  /* ── 꼭 지킬 규칙 (원문 고정) ── */
  if (s.rules) h += '<section class="sysec">' + head("sec-rules", "꼭 지킬 규칙", "") +
    lockedBox(s.rules.title, "<ul>" + s.rules.items.map(i => "<li>" + esc(i) + "</li>").join("") + "</ul>", src(s.file, s.rules.sec)) + "</section>";

  /* ── 1. 시스템 소개 ── */
  h += '<section class="sysec">' + head("sec-intro", "1. 시스템 소개", "");
  if (s.effects) h += "<h3>도입 효과" + src(s.file, s.effects.sec) + '</h3><div class="cgrid">' + s.effects.items.map(i => '<div class="c lv2"><div class="c-d">' + esc(i) + "</div></div>").join("") + "</div>";
  s.extras.forEach(x => {
    let inner = "";
    if (x.type === "pre") inner = '<div class="c lv2"><pre class="flow" style="margin:0;border:none;background:none;padding:0">' + esc(x.text) + "</pre></div>";
    else if (x.type === "list") inner = '<div class="cgrid">' + x.items.map(i => { const p = i.split(": "); return '<div class="c lv2">' + (p.length > 1 ? '<div class="c-t">' + esc(p[0]) + '</div><div class="c-d">' + esc(p.slice(1).join(": ")) + "</div>" : '<div class="c-d">' + esc(i) + "</div>") + "</div>"; }).join("") + "</div>";
    else if (x.view === "steps") inner = '<ol class="stages">' + x.rows.map(r => '<li><span class="num">' + esc(r[0]) + '</span><div><div class="stg-t">' + esc(r[1]) + '</div><div class="c-d">' + esc(r[2]) + "</div>" + chip("입력: " + r[3]) + "</div></li>").join("") + "</ol>";
    else if (x.view === "approval") inner = '<div class="appr">' + x.rows.map(r => '<div class="appr-r"><div class="appr-k">' + esc(r[0]) + '</div><div><div>' + r[1].split(", ").map(t => chip(t)).join("") + '</div><div class="chain">' + r[2].split(" → ").map(p => "<span>" + esc(p) + "</span>").join("<i>→</i>") + "</div></div></div>").join("") + "</div>";
    else inner = tbl(x.headers, x.rows);
    h += x.locked ? lockedBox(x.title, inner, src(s.file, x.sec)) : "<h3>" + esc(x.title) + src(s.file, x.sec) + "</h3>" + inner;
  });
  if (rel.length) h += "<h3>함께 쓰면 좋은 시스템" + src(F0, "§2") + '</h3><div class="cgrid wide">' + rel.map(r => {
    const other = byId(r.a === s.id ? r.b : r.a);
    return '<a class="c link" style="' + sysVars(other.id) + '" href="#/sys/' + other.id + '"><div class="c-t"><span class="mini-ico">' + sysIcon(other.id, 18) + "</span>" + esc(other.name) + ' <span class="go">›</span></div><div class="c-d">' + esc(r.text) + "</div></a>";
  }).join("") + "</div>";
  h += "</section>";

  /* ── 주요 기능 ── */
  h += '<section class="sysec">' + head("sec-features", "주요 기능", src(s.file, s.featuresSec)) +
    '<div class="feat-list">' + s.features.map(f => '<div class="feat"><div class="feat-t">' + esc(f[0]) + '</div><div class="c-d">' + esc(f[1]) + "</div></div>").join("") + "</div></section>";

  /* ── 2. 누가 무엇을 준비하나 ── */
  h += '<section class="sysec">' + head("sec-roles", "2. 누가 무엇을 준비해야 하나", src(s.file, "§2"));
  if (role) {
    const r = s.roles.find(x => x.role === role);
    h += '<div class="my-role"><div class="mr-h">내가 준비할 것 <span class="badge">' + esc(r.role) + " · " + r.items.length + '개</span></div><ul class="check big">' + r.items.map(i => "<li>" + esc(i) + "</li>").join("") + "</ul></div>" +
      '<div class="other-roles noprint"><span class="small muted">다른 역할</span>' + s.roles.filter(x => x.role !== role).map(x => '<button class="rchip sm" data-role="' + esc(x.role) + '">' + esc(x.role) + " · " + x.items.length + "</button>").join("") + "</div>" +
      '<div class="print-only">' + s.roles.filter(x => x.role !== role).map(x => '<div class="c lv2"><div class="c-t">' + esc(x.role) + '</div><ul class="check">' + x.items.map(i => "<li>" + esc(i) + "</li>").join("") + "</ul></div>").join("") + "</div>";
  } else {
    h += '<div class="cgrid wide">' + s.roles.map(r => '<div class="c"><div class="c-t">' + esc(r.role) + ' <span class="badge b-gray">' + r.items.length + '개</span></div><ul class="check">' + r.items.map(i => "<li>" + esc(i) + "</li>").join("") + "</ul></div>").join("") + "</div>";
  }
  h += '<div class="btn-row noprint"><a class="btn sc" href="#/rnr/' + s.id + '">이 체크리스트로 담당자 지정하기 (R&amp;R)</a></div></section>';

  /* ── 3. 셋업 절차 (단계 표시) ── */
  const five = s.setup.headers.length === 5;
  const steps = s.setup.rows.map(r => ({ label: five ? "단계 " + r[0] + " · " + r[1] : r[0], task: five ? r[2] : r[1], owner: five ? r[3] : r[2], out: five ? r[4] : r[3] }));
  const mine = role ? steps.filter(st => roleHit(st.owner, role)).length : 0;

      const hit = roleHit(st.owner, role);

        chip("담당: " + st.owner, hit ? "on" : "") + chip("산출물: " + st.out) + "</div></li>";
    }).join("") + "</ol>" +
    (s.setup.note ? '<div class="note-box"><strong>참고</strong> ' + esc(s.setup.note) + "</div>" : "") +
    '<p class="small muted">신규 현장 전체 일정과 공통 단계는 <a href="#/roadmap">통합 셋업 로드맵</a>을 함께 확인하세요.</p></section>';

  /* ── 4. 필요 서식 ── */
  h += '<section class="sysec">' + head("sec-forms", "4. 필요 서식", src(s.file, "§4")) +
    '<div class="rowlist">' + s.forms.map(f => '<div class="rl"><span class="badge b-gray">' + esc(f[0]) + '</span><span class="rl-m">' + esc(f[1]) + '</span><span class="rl-s">작성 · ' + esc(f[2]) + "</span></div>").join("") + "</div></section>";

  /* ── 5. 일상 운영 흐름 ── */
  h += '<section class="sysec">' + head("sec-flow", "5. 일상 운영 흐름", src(s.file, "§5")) +
    '<ol class="flow-list">' + s.flow.map((f, i) => '<li class="' + (role ? (roleHit(f, role) ? "hit" : "dim") : "") + '"><span class="num">' + (i + 1) + "</span><span>" + esc(f) + "</span></li>").join("") + "</ol></section>";

  /* ── 6. FAQ ── */
  h += '<section class="sysec">' + head("sec-faq", "6. 자주 묻는 질문 (FAQ)", src(s.file, "§6")) +
    '<input type="text" class="faq-search noprint" id="faqQ" placeholder="FAQ에서 찾기 (예: 외국인, 마감, 계정)">' +
    '<div id="faqList">' + s.faq.map((f, i) => '<details class="faq' + (f[2] ? " lockf" : "") + '"' + (f[2] ? " open" : "") + "><summary><span class=\"q\">Q" + (i + 1) + "</span>" + esc(f[0]) + (f[2] ? ' <span class="badge b-lock">원문 고정</span>' : "") + '</summary><p>' + esc(f[1]) + "</p></details>").join("") + "</div>" +
    '<p class="small muted" id="faqNone" style="display:none">일치하는 질문이 없어요. 아래 문의처로 문의하세요.</p></section>';

  /* ── 7. 문의처 ── */
  h += '<section class="sysec">' + head("sec-contact", "7. 문의처", src(s.file, "§7")) +
    '<div class="rowlist">' + s.contacts.map(c => '<div class="rl"><span class="rl-m">' + esc(c) + "</span></div>").join("") + "</div>" +
    '<p class="small muted">공통 문의처는 <a href="#/roadmap">통합 셋업 로드맵</a> 하단을 참고하세요.</p></section>';

  h += "</div></div></div>";
  $app.innerHTML = h;

  $app.querySelectorAll("[data-role]").forEach(b => b.onclick = () => {
    sysRoleSel[s.id] = b.dataset.role; const y = window.pageYOffset;
    pageSystem(s.id); window.scrollTo(0, y);
    if (b.dataset.role) toast(b.dataset.role + " 기준으로 강조했어요");
  });

    const q = norm(fq.value); let shown = 0;
    $app.querySelectorAll("#faqList details").forEach(d => { const ok = !q || norm(d.textContent).indexOf(q) >= 0; d.style.display = ok ? "" : "none"; if (ok) shown++; if (q && ok) d.open = true; });
    document.getElementById("faqNone").style.display = shown ? "none" : "";
  });
  updateSpy();
  if (anchor === "setup") { scrollToId("sec-roles"); requestAnimationFrame(() => scrollToId("sec-roles")); }
}

/* 목차 현재 위치 표시 */
function updateSpy() {
  const links = document.querySelectorAll(".side-toc a[data-sec]"); if (!links.length) return;
  const off = headerH() + 40; let cur = links[0].dataset.sec;
  links.forEach(a => { const el = document.getElementById(a.dataset.sec); if (el && el.getBoundingClientRect().top - off <= 0) cur = a.dataset.sec; });
  links.forEach(a => a.classList.toggle("on", a.dataset.sec === cur));
}
window.addEventListener("scroll", updateSpy, { passive: true });
function syncHeaderVar() { document.documentElement.style.setProperty("--hd", headerH() + "px"); }
window.addEventListener("resize", syncHeaderVar);

    '<div class="btn-row noprint"><a class="btn" href="#/rnr">우리 현장 R&amp;R 작성</a><button class="btn ghost" data-print="1">인쇄</button></div></section>' +

/* =====================================================================
   화면 ⑤ 우리 현장 R&R  (3-3 기본값 생성 [규칙] / 담당자 입력·확정 [사람])
   ===================================================================== */
const RNR_KEY = "siteGuide.rnr.v1";
function emptyRnr() {
  return { site: { name: "", code: "", date: "" }, selected: ["common", "work", "attendance", "docs"], rows: {}, custom: [], seq: 0,
    sign: { writer: "", writerDate: "", reviewer: "", reviewerDate: "", approver: "", approverDate: "", verified: false } };
}
let rnr = Object.assign(emptyRnr(), store(RNR_KEY) || {});
function saveRnr() { store(RNR_KEY, rnr); }
function rnrGroups() {
  return [{ id: "common", name: "공통 (통합 셋업 단계)", file: F0, sec: "§4 단계별 상세",
    roles: OVERVIEW.phases.map(p => ({ role: p[1], items: [p[0] + " — 산출물: " + p[2] + (p[3] ? " (" + p[3] + ")" : "")] })) }]
    .concat(SYSTEMS.map(s => ({ id: s.id, name: s.no + ". " + s.name, file: s.file, sec: "§2", roles: s.roles })));
}
function rowState(key) { return rnr.rows[key] || (rnr.rows[key] = { owner: "", contact: "", done: false, note: "", deleted: false, reason: "" }); }
function groupStats(g) {
  let total = 0, done = 0;
  g.roles.forEach((r, ri) => r.items.forEach((_, ii) => { const st = rnr.rows[g.id + "|" + ri + "|" + ii]; if (!(st && st.deleted)) { total++; if (st && st.done) done++; } }));
  rnr.custom.filter(c => c.sys === g.id).forEach(c => { total++; if (c.done) done++; });
  return { total: total, done: done };
}
function pageRnr(pre) {
  if (pre && byId(pre) && rnr.selected.indexOf(pre) < 0) { rnr.selected.push(pre); saveRnr(); }
  const groups = rnrGroups();
  let h = '<section class="card"><h1>우리 현장 R&amp;R</h1>' +
    '<div class="muted small">기준 문서의 역할별 준비사항이 기본값으로 들어가 있어요. 담당자와 연락처는 현장에서 직접 입력하세요. 기준 항목을 삭제할 때는 사유를 입력해야 해요. 입력값은 이 브라우저에 자동 저장돼요.</div>' +
    '<div class="three" style="margin-top:10px">' +
      '<div><label class="fld">현장명</label><input type="text" data-site="name" value="' + esc(rnr.site.name) + '" placeholder="예) OO 신축공사"></div>' +
      '<div><label class="fld">현장 코드</label><input type="text" data-site="code" value="' + esc(rnr.site.code) + '" placeholder="시스템운영팀 발급 코드"></div>' +
      '<div><label class="fld">작성일</label><input type="date" data-site="date" value="' + esc(rnr.site.date) + '"></div>' +
    "</div>" +
    '<div class="noprint"><label class="fld">적용할 시스템 선택</label><div class="sysselect">' +
      groups.map(g => {
        const s = byId(g.id);
        return '<label><input type="checkbox" data-sel="' + g.id + '"' + (rnr.selected.indexOf(g.id) >= 0 ? " checked" : "") + "> " + esc(g.name) + (s ? " " + catBadge(s.category) : "") + "</label>";
      }).join("") +
    '</div><p class="small muted">필수/조건부 필수 기준은 <a href="#/roadmap">통합 셋업 로드맵</a>을 확인하세요.' + src(F0, "§5") + "</p></div>" +
    '<div class="btn-row noprint"><button class="btn" data-print="1">인쇄 / PDF 저장</button><button class="btn ghost" id="rnrExport">JSON 내보내기</button>' +
    '<button class="btn ghost" id="rnrImportBtn">JSON 불러오기</button>' +
    '<button class="btn danger" id="rnrReset">전체 초기화</button></div></section>';

  h += '<section class="card"><h2>담당자별 R&amp;R 표</h2><div id="rnrSummary" class="small"></div>' +
    '<table class="rnr-table"><thead><tr><th style="width:15%">역할 (기준)</th><th>준비 항목</th><th style="width:12%">담당자</th><th style="width:13%">연락처</th><th style="width:5%">완료</th><th style="width:14%">비고</th><th class="noprint" style="width:64px"></th></tr></thead><tbody id="rnrBody">';
  groups.filter(g => rnr.selected.indexOf(g.id) >= 0).forEach(g => {
    h += '<tr class="grp"><td colspan="7">' + esc(g.name) + src(g.file, g.sec) + ' <span class="badge b-brand" data-stat="' + g.id + '"></span></td></tr>';
    g.roles.forEach((r, ri) => r.items.forEach((item, ii) => {
      const key = g.id + "|" + ri + "|" + ii; const st = rowState(key);
      h += rowHtml(key, r.role, item, st, false);
    }));
    rnr.custom.filter(c => c.sys === g.id).forEach(c => { h += rowHtml("c:" + c.id, c.role, c.item, c, true); });
    h += '<tr class="noprint"><td><input type="text" list="roles-' + g.id + '" data-addrole="' + g.id + '" placeholder="역할"></td>' +
      '<td colspan="5"><input type="text" data-additem="' + g.id + '" placeholder="현장에서 추가할 준비 항목을 입력하세요"></td>' +
      '<td><button class="btn sm ghost" data-add="' + g.id + '">추가</button></td></tr>' +
      '<datalist id="roles-' + g.id + '">' + Array.from(new Set(g.roles.map(r => r.role))).map(r => '<option value="' + esc(r) + '">').join("") + "</datalist>";
  });
  if (!rnr.selected.length) h += '<tr><td colspan="7" class="muted">적용할 시스템을 선택하세요.</td></tr>';
  h += "</tbody></table></section>";

  const sg = rnr.sign;
  h += '<section class="card"><h2>확인 및 승인</h2><div class="sign">' +
    signBox("작성자 (현장 시스템 담당자)", "writer", sg) + signBox("검토자", "reviewer", sg) + signBox("승인자 (현장소장)", "approver", sg) +
    '</div><label style="display:block;margin-top:10px;font-size:14px"><input type="checkbox" data-sign="verified"' + (sg.verified ? " checked" : "") + "> 승인자가 기준 문서 원본(더미자료 md)과 대조했음을 확인함</label>" +
    '<p class="small muted">이 표는 자동으로 전송되지 않아요. 인쇄하거나 PDF·JSON으로 저장해서 직접 공유하세요.</p></section>';
  $app.innerHTML = h;
  updateRnrStats();
  bindRnr();
}
function rowHtml(key, role, item, st, custom) {
  const dis = st.deleted ? " disabled" : "";
  return '<tr data-key="' + esc(key) + '"' + (st.deleted ? ' class="deleted"' : "") + ">" +
    "<td>" + esc(role) + "</td>" +
    "<td>" + esc(item) + (custom ? ' <span class="badge b-gray">현장 추가</span>' : "") + (st.deleted ? '<span class="reason">삭제 사유: ' + esc(st.reason) + "</span>" : "") + "</td>" +
    '<td class="keep"><input type="text" data-f="owner" value="' + esc(st.owner) + '"' + dis + "></td>" +
    '<td class="keep"><input type="text" data-f="contact" value="' + esc(st.contact) + '"' + dis + "></td>" +
    '<td class="keep c"><input type="checkbox" data-f="done"' + (st.done ? " checked" : "") + dis + "></td>" +
    '<td class="keep"><input type="text" data-f="note" value="' + esc(st.note) + '"' + dis + "></td>" +
    '<td class="keep noprint">' + (st.deleted ? '<button class="btn sm ghost" data-act="restore">복원</button>' : '<button class="btn sm danger" data-act="del">삭제</button>') + "</td></tr>";
}
function signBox(label, k, sg) {
  return '<div class="box"><div class="small" style="font-weight:600">' + esc(label) + "</div>" +
    '<input type="text" data-sign="' + k + '" value="' + esc(sg[k]) + '" placeholder="성명" style="margin-top:6px">' +
    '<input type="date" data-sign="' + k + 'Date" value="' + esc(sg[k + "Date"]) + '" style="margin-top:6px">' +
    '<div class="stamp">서명</div></div>';
}
function getRowObj(key) {
  if (key.indexOf("c:") === 0) return rnr.custom.find(c => "c:" + c.id === key);
  return rowState(key);
}
function updateRnrStats() {
  let T = 0, D = 0;
  rnrGroups().filter(g => rnr.selected.indexOf(g.id) >= 0).forEach(g => {
    const st = groupStats(g); T += st.total; D += st.done;
    const el = $app.querySelector('[data-stat="' + g.id + '"]'); if (el) el.textContent = "완료 " + st.done + " / " + st.total;
  });
  let assigned = 0, all = 0;
  rnrGroups().filter(g => rnr.selected.indexOf(g.id) >= 0).forEach(g => {
    g.roles.forEach((r, ri) => r.items.forEach((_, ii) => { const s = rnr.rows[g.id + "|" + ri + "|" + ii]; if (!(s && s.deleted)) { all++; if (s && s.owner.trim()) assigned++; } }));
    rnr.custom.filter(c => c.sys === g.id).forEach(c => { all++; if (c.owner.trim()) assigned++; });
  });
  const sum = document.getElementById("rnrSummary");
  if (sum) sum.innerHTML = "선택한 시스템 전체: 담당자 지정 <strong>" + assigned + " / " + all + "</strong> · 완료 <strong>" + D + " / " + T + "</strong>";
}
function bindRnr() {
  $app.querySelectorAll("[data-site]").forEach(i => i.addEventListener("input", () => { rnr.site[i.dataset.site] = i.value; saveRnr(); }));
  $app.querySelectorAll("[data-sel]").forEach(i => i.addEventListener("change", () => {
    const id = i.dataset.sel;
    if (i.checked) { if (rnr.selected.indexOf(id) < 0) rnr.selected.push(id); } else rnr.selected = rnr.selected.filter(x => x !== id);
    const order = rnrGroups().map(g => g.id); rnr.selected.sort((a, b) => order.indexOf(a) - order.indexOf(b));
    saveRnr(); pageRnr();
  }));
  $app.querySelectorAll("[data-sign]").forEach(i => i.addEventListener(i.type === "checkbox" ? "change" : "input", () => {
    rnr.sign[i.dataset.sign] = i.type === "checkbox" ? i.checked : i.value; saveRnr();
  }));
  const body = document.getElementById("rnrBody");
  body.addEventListener("input", e => {
    const tr = e.target.closest("tr[data-key]"); if (!tr || !e.target.dataset.f) return;
    const o = getRowObj(tr.dataset.key); if (!o) return;
    o[e.target.dataset.f] = e.target.type === "checkbox" ? e.target.checked : e.target.value;
    saveRnr(); updateRnrStats();
  });
  body.addEventListener("change", e => {
    if (e.target.type !== "checkbox") return;
    const tr = e.target.closest("tr[data-key]"); if (!tr) return;
    const o = getRowObj(tr.dataset.key); if (!o) return;
    o.done = e.target.checked; saveRnr(); updateRnrStats();
  });
  body.addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    if (b.dataset.add) {
      const g = b.dataset.add;
      const role = $app.querySelector('[data-addrole="' + g + '"]').value.trim();
      const item = $app.querySelector('[data-additem="' + g + '"]').value.trim();
      if (!role || !item) { toast("역할과 준비 항목을 모두 입력하세요"); return; }
      rnr.seq = (rnr.seq || 0) + 1;
      rnr.custom.push({ id: rnr.seq, sys: g, role: role, item: item, owner: "", contact: "", done: false, note: "", deleted: false, reason: "" });
      saveRnr(); pageRnr(); toast("현장 항목을 추가했어요"); return;
    }
    const tr = b.closest("tr[data-key]"); if (!tr) return;
    const key = tr.dataset.key;
    if (b.dataset.act === "del") {
      if (key.indexOf("c:") === 0) {
        askConfirm("현장 추가 항목 삭제", "현장에서 추가한 항목을 삭제할까요?", "삭제", () => {
          rnr.custom = rnr.custom.filter(c => "c:" + c.id !== key); saveRnr(); pageRnr();
        });
      } else {
        askText("기준 항목 삭제", "기준 문서의 항목이에요. 삭제하는 사유를 입력하세요. (필수)", "예) 이 현장은 게이트 대신 태블릿 체크 방식 사용", "삭제", reason => {
          const st = rowState(key); st.deleted = true; st.reason = reason; saveRnr(); pageRnr(); toast("사유와 함께 삭제 처리했어요");
        });
      }
      return;
    }
    if (b.dataset.act === "restore") { const st = getRowObj(key); st.deleted = false; st.reason = ""; saveRnr(); pageRnr(); }
  });
  document.getElementById("rnrExport").onclick = () => {
    const name = "R&R_" + (rnr.site.code || rnr.site.name || "현장").replace(/[\\/:*?"<>|\s]/g, "_") + ".json";
    const text = JSON.stringify({ type: "siteGuide.rnr", version: 1, data: rnr }, null, 2);
    let saved = true;
    try { download(name, text); } catch (e) { saved = false; }
    // 다운로드가 막힌 환경(앱 내장 브라우저 등)에서도 쓸 수 있도록 내용을 함께 보여줌
    openModal({ title: "JSON 내보내기", okText: "닫기", cancelText: "",
      body: '<p class="small">' + (saved ? "파일 저장을 시도했어요(" + esc(name) + "). " : "") + "파일이 저장되지 않았다면 아래 내용을 복사해서 보관하세요.</p>" +
        '<textarea id="mText" rows="10" readonly style="font-family:Consolas,monospace;font-size:12px">' + esc(text) + "</textarea>" +
        '<div class="btn-row"><button class="btn ghost sm" id="mCopy">전체 복사</button></div>',
      onOpen: () => { document.getElementById("mCopy").onclick = () => { copyText(document.getElementById("mText")); }; } });
  };
  document.getElementById("rnrImportBtn").onclick = () => {
    openModal({ title: "JSON 불러오기", okText: "불러오기", cancelText: "취소",
      body: '<p class="small">내보낸 JSON 파일을 선택하거나, 복사해 둔 내용을 붙여넣으세요. 지금 입력된 내용은 불러온 내용으로 바뀌어요.</p>' +
        '<input type="file" id="mFile" accept=".json,application/json" style="margin-bottom:8px">' +
        '<textarea id="mText" rows="8" placeholder="여기에 JSON 내용 붙여넣기" style="font-family:Consolas,monospace;font-size:12px"></textarea>',
      onOpen: () => {
        document.getElementById("mFile").onchange = e => {
          const f = e.target.files[0]; if (!f) return;
          const rd = new FileReader(); rd.onload = () => { document.getElementById("mText").value = rd.result; }; rd.readAsText(f, "utf-8");
        };
      },
      onOk: () => {
        try {
          const j = JSON.parse(document.getElementById("mText").value);
          if (j.type !== "siteGuide.rnr" || !j.data || !j.data.rows) throw new Error("형식 오류");
          rnr = Object.assign(emptyRnr(), j.data); saveRnr(); pageRnr(); toast("불러왔어요"); return true;
        } catch (err) { return "R&R JSON 형식이 아니에요. 내보내기로 만든 내용인지 확인하세요."; }
      } });
  };
  document.getElementById("rnrReset").onclick = () => askConfirm("전체 초기화", "입력한 R&R 내용을 모두 지울까요? 되돌릴 수 없어요.", "모두 지우기", () => { rnr = emptyRnr(); saveRnr(); pageRnr(); toast("초기화했어요"); });
}

/* =====================================================================
   화면 ⑥ 구축 요청 계획서 (3-2 초안 [AI 판단 대체 로직] / 제출 [사람])
   ===================================================================== */
const REQ_KEY = "siteGuide.request.v1";
const REQ_USERS = ["현장소장", "현장 시스템 담당자 (공무팀)", "공종/분야 담당자", "안전 담당자", "품질 담당자", "자재 담당자", "협력업체 현장대리인", "자재 제작사/공급사", "정문 경비/게이트 운영자", "감리단 / 발주처"];
function emptyReq() { return { site: "", code: "", requester: "", dept: "", contact: "", need: "", current: "", problem: "", features: "", users: [], usersEtc: "", links: [], effect: "", schedule: "", drafted: false }; }
let req = Object.assign(emptyReq(), store(REQ_KEY) || {});
function saveReq() { store(REQ_KEY, req); }
function pageRequest() {
  const f = (k, label, ph, rows) => '<label class="fld">' + label + "</label>" + (rows
    ? '<textarea data-r="' + k + '" rows="' + rows + '" placeholder="' + esc(ph) + '">' + esc(req[k]) + "</textarea>"
    : '<input type="text" data-r="' + k + '" value="' + esc(req[k]) + '" placeholder="' + esc(ph) + '">');
  $app.innerHTML =
    '<section class="card noprint"><h1>시스템 구축 요청 계획서</h1>' +
    '<div class="muted small">기존 5개 시스템으로 해결되지 않는 업무를 정리해요. 입력한 내용으로 계획서 초안을 만들고, 현장소장 확인 후 <strong>직접</strong> 시스템운영팀에 제출하세요. 자동으로 전송되지 않아요.</div>' +
    '<div class="three">' + f("site", "요청 현장명", "예) OO 신축공사") + f("code", "현장 코드", "") + f("requester", "요청자", "성명") + "</div>" +
    '<div class="two">' + f("dept", "소속/직책", "예) 공무팀 대리") + f("contact", "연락처", "") + "</div>" +
    f("need", "요청 업무 (하고 싶은 일)", "예) 현장 식당 식권을 근로자별로 관리하고 싶어요", 2) +
    '<div class="two">' + f("current", "현재 업무 방식", "지금은 어떻게 하고 있나요?", 3) + f("problem", "문제점", "무엇이 불편하거나 비효율적인가요?", 3) + "</div>" +
    f("features", "필요 기능 (한 줄에 하나씩)", "예) 근로자별 식권 발급 이력 조회\n예) 업체별 월 사용량 집계", 4) +
    '<label class="fld">주 사용자</label><div class="sysselect">' + REQ_USERS.map(u => '<label><input type="checkbox" data-ru="' + esc(u) + '"' + (req.users.indexOf(u) >= 0 ? " checked" : "") + "> " + esc(u) + "</label>").join("") + "</div>" +
    f("usersEtc", "기타 사용자", "") +
    '<label class="fld">연계 희망 시스템</label><div class="sysselect">' + SYSTEMS.map(s => '<label><input type="checkbox" data-rl="' + s.id + '"' + (req.links.indexOf(s.id) >= 0 ? " checked" : "") + "> " + esc(s.name) + "</label>").join("") + "</div>" +
    '<div class="two">' + f("effect", "기대 효과", "", 3) + f("schedule", "희망 적용 일정", "비워 두면 '미확인'으로 표시돼요", 3) + "</div>" +
    '<div class="btn-row"><button class="btn" id="mkDraft">계획서 초안 만들기</button><button class="btn danger" id="reqReset">입력 초기화</button></div></section>' +
    '<div id="draft"></div>';
  $app.querySelectorAll("[data-r]").forEach(i => i.addEventListener("input", () => { req[i.dataset.r] = i.value; saveReq(); }));
  $app.querySelectorAll("[data-ru]").forEach(i => i.addEventListener("change", () => { const u = i.dataset.ru; req.users = i.checked ? req.users.concat([u]) : req.users.filter(x => x !== u); saveReq(); }));
  $app.querySelectorAll("[data-rl]").forEach(i => i.addEventListener("change", () => { const u = i.dataset.rl; req.links = i.checked ? req.links.concat([u]) : req.links.filter(x => x !== u); saveReq(); }));
  document.getElementById("mkDraft").onclick = () => {
    if (!req.need.trim()) { toast("요청 업무를 입력하세요"); return; }
    req.drafted = true; saveReq(); renderDraft(); scrollToId("draft");
  };
  document.getElementById("reqReset").onclick = () => askConfirm("입력 초기화", "구축 요청 계획서 입력 내용을 모두 지울까요?", "모두 지우기", () => { req = emptyReq(); saveReq(); pageRequest(); toast("초기화했어요"); });
  if (req.drafted) renderDraft();
}
function renderDraft() {
  const v = (s, empty) => s && String(s).trim() ? esc(s).replace(/\n/g, "<br>") : '<span class="muted">' + (empty || "(미입력)") + "</span>";
  const feats = req.features.split("\n").map(x => x.trim()).filter(Boolean);
  const users = req.users.concat(req.usersEtc.trim() ? [req.usersEtc.trim()] : []);
  const m = matchSystems(req.need + "\n" + req.features);
  const review = m.length
    ? "<p class='small'>요청 내용과 일부 대응되는 기존 기능이 있어요. 기존 시스템 개선으로 해결할 수 있는지 시스템운영팀 검토가 필요해요.</p><ul>" +
      m.map(r => "<li><strong>" + esc(r.sys.name) + "</strong> (" + r.verdict + ") — " + r.hits.map(h => esc(h.feature)).join(", ") + src(r.sys.file, r.sys.featuresSec) + "</li>").join("") + "</ul>"
    : "<p class='small'>기준 문서의 5개 시스템에서 대응되는 기능을 찾지 못했어요.</p>";
  document.getElementById("draft").innerHTML =
    '<section class="card"><div class="noprint" style="margin-bottom:10px"><span class="ai-note">초안 구성: 입력값을 항목별로 배치하고 기존 시스템과 대조했어요 (AI 판단 대체 로직). 내용 확정은 사람이 해요.</span>' +
    '<div class="btn-row"><button class="btn" data-print="1">인쇄 / PDF 저장</button></div></div>' +
    '<div class="doc"><h1>시스템 구축 요청 계획서</h1>' +
    "<h3>1. 요청 개요</h3><table>" +
      "<tr><th>요청 현장</th><td>" + v(req.site) + "</td><th>현장 코드</th><td>" + v(req.code) + "</td></tr>" +
      "<tr><th>요청자</th><td>" + v(req.requester) + "</td><th>소속/직책</th><td>" + v(req.dept) + "</td></tr>" +
      "<tr><th>연락처</th><td colspan='3'>" + v(req.contact) + "</td></tr></table>" +
    "<h3>2. 요청 배경 (요청 업무)</h3><p>" + v(req.need) + "</p>" +
    "<h3>3. 현재 업무 방식과 문제점</h3><table><tr><th>현재 방식</th><td>" + v(req.current) + "</td></tr><tr><th>문제점</th><td>" + v(req.problem) + "</td></tr></table>" +
    "<h3>4. 필요 기능</h3>" + (feats.length ? "<ol>" + feats.map(x => "<li>" + esc(x) + "</li>").join("") + "</ol>" : "<p>" + v("") + "</p>") +
    "<h3>5. 기존 시스템 검토 결과 (에이전트 대조 · 사람 확인 필요)</h3>" + review +
    "<h3>6. 주 사용자</h3><p>" + (users.length ? esc(users.join(", ")) : v("")) + "</p>" +
    "<h3>7. 연계 희망 시스템</h3><p>" + (req.links.length ? esc(req.links.map(id => byId(id).name).join(", ")) : v("")) + "</p>" +
    "<h3>8. 기대 효과</h3><p>" + v(req.effect) + "</p>" +
    "<h3>9. 희망 적용 일정</h3><p>" + v(req.schedule, "미확인") + "</p>" +
    "<h3>10. 확인 및 접수</h3>" +
    '<div class="sign"><div class="box"><div class="small" style="font-weight:600">요청자</div><div class="small">성명: ' + v(req.requester) + '</div><div class="stamp">서명</div></div>' +
    '<div class="box"><div class="small" style="font-weight:600">현장소장 확인</div><div class="small">일자:</div><div class="stamp">서명</div></div>' +
    '<div class="box"><div class="small" style="font-weight:600">사업부 시스템운영팀 접수</div><div class="small">접수일:</div>' +
    '<div class="small">검토 결과: □ 기존 시스템 개선 □ 신규 구축 □ 반려</div><div class="stamp">서명</div></div></div>' +
    '<p class="small muted" style="margin-top:10px">이 계획서는 자동으로 전송되지 않아요. 현장소장 확인 후 요청자가 직접 시스템운영팀에 제출하세요. (문의: ' + esc(OVERVIEW.contacts[0][1] + " " + OVERVIEW.contacts[0][2]) + ")" + src(F0, "§6") + "</p></div></section>";
}

/* =====================================================================
   라우터
   ===================================================================== */
function route() {
  const parts = (location.hash || "#/home").replace(/^#\//, "").split("/");
  const page = parts[0] || "home", arg = parts[1], arg2 = parts[2];
  document.querySelectorAll("#nav a").forEach(a => a.classList.toggle("active", a.dataset.p === page || (page === "sys" && a.dataset.p === "systems")));
  window.scrollTo(0, 0);
  syncHeaderVar();
  if (page === "systems") pageSystems();
  else if (page === "sys") pageSystem(arg, arg2);
  else if (page === "roadmap") pageRoadmap();
  else if (page === "rnr") pageRnr(arg);
  else if (page === "request") pageRequest();
  else pageHome();
}
window.addEventListener("hashchange", route);
route();
</script>
</body>
</html>
